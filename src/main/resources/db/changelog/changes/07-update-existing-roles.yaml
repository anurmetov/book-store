databaseChangeLog:
  - changeSet:
      id: update-existing-roles
      author: Artem
      changes:
        - update:
            tableName: roles
            columns:
              - column:
                  name: role
                  value: ROLE_USER
            where: role = 'USER'


        - update:
            tableName: roles
            columns:
              - column:
                  name: role
                  value: ROLE_ADMIN
            where: role = 'ADMIN'

